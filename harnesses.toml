# AI Coding Harness Configuration
# Defines where each harness expects its config and how to map our unified repo.
#
# Source of truth: this repo (~/dev/ai)
# Install: ./install.sh [harness|all]   (or python install.py)
# Uninstall: ./uninstall.sh [harness|all]
#
# Minimal profile: only skills + tiny per-harness config files are installed,
# plus one global guidelines file for Claude Code (harness/claude/CLAUDE.md).
# No rules, hooks, agents, plugins, or MCP servers.
#
# Manual step, not installed here: Claude Code writes its plugin cache to
# ~/.claude/plugins. To keep that cache out of ~/.claude, link it yourself with
#   ln -s ~/dev/ai/plugins ~/.claude/plugins
# The repo ignores plugins/ (see .gitignore) because it holds machine state.
#
# skills_mode:
#   "directory" (default) → symlink the whole skills/ folder into the target
#   "children"            → create individual symlinks for each skill (codex, droid, etc.)
# Children mode leaves a symlinked target skills directory and its contents untouched.

# ─────────────────────────────────────────────────────────────────────────────
# Claude Code
# Docs: https://docs.anthropic.com/en/docs/claude-code
# ─────────────────────────────────────────────────────────────────────────────
[claude]
target = "~/.claude"

[claude.symlinks]
skills = "skills"
"settings.json" = "harness/claude/settings.json"
"CLAUDE.md" = "harness/claude/CLAUDE.md"

# ─────────────────────────────────────────────────────────────────────────────
# ForgeCode
# Docs: https://forgecode.dev/docs/
# ─────────────────────────────────────────────────────────────────────────────
[forge]
target = "~/forge"

[forge.symlinks]
skills = "skills"
".forge.toml" = "harness/forge/.forge.toml"

# ─────────────────────────────────────────────────────────────────────────────
# OpenCode
# Docs: https://opencode.ai/docs/config
# ─────────────────────────────────────────────────────────────────────────────
[opencode]
target = "~/.config/opencode"

[opencode.symlinks]
skills = "skills"
"opencode.json" = "harness/opencode/opencode.json"

# ─────────────────────────────────────────────────────────────────────────────
# Codex CLI (OpenAI)
# Docs: https://developers.openai.com/codex
# ─────────────────────────────────────────────────────────────────────────────
[codex]
target = "~/.codex"
skills_mode = "children"

[codex.symlinks]
skills = "skills"

# Codex writes settings and project trust to its user config.
# Install defaults once and localize only the link installed by older versions.
# Subsequent installs and uninstalls leave the local config alone.
[codex.local_configs."config.toml"]
seed = "harness/codex/defaults.toml"
legacy_link = "harness/codex/config.toml"

# ─────────────────────────────────────────────────────────────────────────────
# Factory.ai Droid
# Docs: https://docs.factory.ai/cli/configuration/skills
# ─────────────────────────────────────────────────────────────────────────────
[droid]
target = "~/.factory"
skills_mode = "children"

[droid.symlinks]
skills = "skills"

# ─────────────────────────────────────────────────────────────────────────────
# Pi
# Docs: https://github.com/mariozechner/pi
# ─────────────────────────────────────────────────────────────────────────────
[pi]
target = "~/.pi/agent"
installer = "pi-config/install.sh"
uninstaller = "pi-config/uninstall.sh"
target_env = "PI_CODING_AGENT_DIR"

# ─────────────────────────────────────────────────────────────────────────────
# Cursor
# Cursor's agent/CLI mode uses a custom skills directory name.
# Docs: https://cursor.com (CLI + Composer rules)
# ─────────────────────────────────────────────────────────────────────────────
[cursor]
target = "~/.cursor"

[cursor.symlinks]
# NOTE: intentionally NOT symlinking skills here. Cursor's CLI auto-syncs its
# built-in agent skills into ~/.cursor/skills-cursor; pointing that dir at the
# shared repo made Cursor write its built-ins into ~/dev/ai/skills, which then
# propagated into every other harness. Cursor now owns its skills dir directly.
# "skills-cursor" = "skills"
# "cli-config.json" = "harness/cursor/cli-config.json"   # add when you want to manage it

# ─────────────────────────────────────────────────────────────────────────────
# Grok (xAI Grok Build / Grok CLI)
# Skills live directly under ~/.grok/skills
# Docs: https://grok.x.ai
# ─────────────────────────────────────────────────────────────────────────────
[grok]
target = "~/.grok"

[grok.symlinks]
skills = "skills"
# "config.toml" = "harness/grok/config.toml"             # add when you want a managed base config
